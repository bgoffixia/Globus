openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Simulation-only Globus wallet API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bank
    description: Authenticated wallet and banking operations
  - name: admin
    description: Privileged administrative operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bank/me:
    get:
      operationId: getBankProfile
      tags: [bank]
      summary: Get the authenticated user's Globus Bank profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/dashboard:
    get:
      operationId: getBankDashboard
      tags: [bank]
      summary: Get the user's simulated balances and recent activity
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/wallets:
    get:
      operationId: listBankWallets
      tags: [bank]
      summary: List the authenticated user's currency wallets
      responses:
        "200":
          description: Currency wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/transactions:
    get:
      operationId: listBankTransactions
      tags: [bank]
      summary: Search the authenticated user's transaction history
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CurrencyCode"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/profile:
    put:
      operationId: updateBankProfile
      tags: [bank]
      summary: Save user profile and accept the account terms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/verification/documents:
    get:
      operationId: listMyIdentityDocuments
      tags: [bank]
      summary: List identity documents belonging to the authenticated user
      responses:
        "200":
          description: The user's identity documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentityDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/verification/documents/upload-url:
    post:
      operationId: createIdentityDocumentUploadUrl
      tags: [bank]
      summary: Request a private upload URL for an identity document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityDocumentUploadInput"
      responses:
        "201":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityDocumentUploadUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/verification/documents/{documentId}/complete:
    post:
      operationId: completeIdentityDocumentUpload
      tags: [bank]
      summary: Validate and complete an identity document upload
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Uploaded identity document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/verification/documents/{documentId}:
    delete:
      operationId: deleteMyIdentityDocument
      tags: [bank]
      summary: Remove an identity document before it enters review
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Document removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/verification/submit:
    post:
      operationId: submitIdentityDocuments
      tags: [bank]
      summary: Submit uploaded identity documents for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityVerificationSubmissionInput"
      responses:
        "200":
          description: Verification request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/transfers:
    post:
      operationId: createBankTransfer
      tags: [bank]
      summary: Simulate a transfer to another registered Globus user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Posted simulated transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/external-transfers:
    post:
      operationId: createExternalTransfer
      tags: [bank]
      summary: Simulate a transfer to an external recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalTransferInput"
      responses:
        "201":
          description: Posted simulated external transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/incoming-external-transfers:
    post:
      operationId: createIncomingExternalTransfer
      tags: [bank]
      summary: Simulate an incoming transfer from an external source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingExternalTransferInput"
      responses:
        "201":
          description: Posted simulated incoming external transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/simulation-requests:
    post:
      operationId: createSimulationRequest
      tags: [bank]
      summary: Record a simulated deposit, withdrawal, or exchange request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequestInput"
      responses:
        "201":
          description: Recorded simulated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check whether the signed-in user has administrator access
      responses:
        "200":
          description: Admin access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get operational totals from stored simulation records
      responses:
        "200":
          description: Admin summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Search and list user records
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: User records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/admin/users/{userId}:
    get:
      operationId: getAdminUserDetail
      tags: [admin]
      summary: Get one user's profile, wallets, and recent activity
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: User management detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/users/{userId}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [admin]
      summary: Suspend or reactivate a user with a documented reason
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusInput"
      responses:
        "200":
          description: Updated account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/users/{userId}/verification-documents:
    get:
      operationId: listAdminIdentityDocuments
      tags: [admin]
      summary: List a user's identity documents for admin review
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Identity documents available for review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentityDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/identity-documents/{documentId}/content:
    get:
      operationId: getAdminIdentityDocumentContent
      tags: [admin]
      summary: Stream an identity document to an authorized admin
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private identity document content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/users/{userId}/verification:
    patch:
      operationId: updateAdminUserVerification
      tags: [admin]
      summary: Record an identity review decision
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIdentityVerificationInput"
      responses:
        "200":
          description: Updated identity review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/admin/users/{userId}/funding:
    post:
      operationId: createAdminFunding
      tags: [admin]
      summary: Add a simulated balance credit to a user wallet
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFundingInput"
      responses:
        "201":
          description: Simulated funding transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/admin/ledger:
    get:
      operationId: listAdminLedger
      tags: [admin]
      summary: Review posted ledger transactions
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CurrencyCode"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent ledger transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/admin/transactions/{transactionId}:
    delete:
      operationId: deleteAdminTransaction
      tags: [admin]
      summary: Permanently delete a transaction and its ledger entries
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTransactionDeleteInput"
      responses:
        "200":
          description: Deleted transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransactionDeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sign in is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The current user is not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested record was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The operation conflicts with current account or balance state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CurrencyCode:
      type: string
      enum: [USD, EUR, GBP, NGN, CAD, AUD]
    TransactionStatus:
      type: string
      enum: [completed, pending, failed, reversed]
    TransactionType:
      type: string
      enum: [simulation_credit, admin_funding, transfer_in, transfer_out, external_transfer, external_transfer_in, deposit_request, withdrawal_request, exchange_request]
    Wallet:
      type: object
      properties:
        id: { type: string }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        available: { type: string }
        pending: { type: string }
        reserved: { type: string }
        status: { type: string, enum: [active, restricted] }
      required: [id, currency, available, pending, reserved, status]
    BankProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        verificationStatus: { type: string, enum: [not_started, pending, approved, rejected, additional_information_required] }
        verificationNote: { type: ["string", "null"] }
        accountStatus: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
      required: [id, email, firstName, lastName, phone, country, verificationStatus, verificationNote, accountStatus, createdAt]
    BankProfileInput:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, minLength: 3, maxLength: 32 }
        country: { type: string, minLength: 2, maxLength: 80 }
        acceptedTerms: { type: boolean, const: true }
      required: [firstName, lastName, phone, country, acceptedTerms]
    IdentityDocumentContentType:
      type: string
      enum: [application/pdf, image/jpeg, image/png]
    IdentityDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        contentType: { $ref: "#/components/schemas/IdentityDocumentContentType" }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        status: { type: string, enum: [uploading, uploaded] }
        createdAt: { type: string, format: date-time }
        uploadedAt: { type: ["string", "null"], format: date-time }
      required: [id, contentType, sizeBytes, status, createdAt, uploadedAt]
    IdentityDocumentUploadInput:
      type: object
      properties:
        contentType: { $ref: "#/components/schemas/IdentityDocumentContentType" }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
      required: [contentType, sizeBytes]
    IdentityDocumentUploadUrl:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
      required: [documentId, uploadUrl]
    IdentityVerificationSubmissionInput:
      type: object
      properties:
        confirmed: { type: boolean, const: true }
      required: [confirmed]
    BankTransaction:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        type: { $ref: "#/components/schemas/TransactionType" }
        status: { $ref: "#/components/schemas/TransactionStatus" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string }
        fee: { type: string }
        counterparty: { type: ["string", "null"] }
        description: { type: string }
        mode: { type: string, enum: [simulation] }
        createdAt: { type: string, format: date-time }
      required: [id, reference, type, status, currency, amount, fee, counterparty, description, mode, createdAt]
    BankDashboard:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/BankProfile" }
        wallets:
          type: array
          items: { $ref: "#/components/schemas/Wallet" }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/BankTransaction" }
        referenceCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        simulationMode: { type: boolean, const: true }
      required: [profile, wallets, recentTransactions, referenceCurrency, simulationMode]
    TransferInput:
      type: object
      properties:
        recipientEmail: { type: string, format: email }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        description: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
      required: [recipientEmail, currency, amount, idempotencyKey]
    ExternalTransferInput:
      type: object
      properties:
        recipientName: { type: string, minLength: 1, maxLength: 120 }
        destinationCountry: { type: string, minLength: 2, maxLength: 80 }
        bankName: { type: string, minLength: 1, maxLength: 120 }
        accountNumberLast4: { type: string, pattern: "^[A-Z0-9]{4}$" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        description: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
      required: [recipientName, destinationCountry, bankName, accountNumberLast4, currency, amount, idempotencyKey]
    IncomingExternalTransferInput:
      type: object
      properties:
        sourceName: { type: string, minLength: 1, maxLength: 120 }
        sourceCountry: { type: string, minLength: 2, maxLength: 80 }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        description: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
      required: [sourceName, sourceCountry, currency, amount, idempotencyKey]
    SimulationRequestInput:
      type: object
      properties:
        type: { type: string, enum: [deposit, withdrawal, exchange] }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        destinationCurrency: { anyOf: [{ $ref: "#/components/schemas/CurrencyCode" }, { type: "null" }] }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
      required: [type, currency, amount, idempotencyKey]
    SimulationRequest:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        type: { type: string, enum: [deposit, withdrawal, exchange] }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        destinationCurrency: { type: ["string", "null"] }
        amount: { type: string }
        status: { type: string, enum: [pending_provider_setup] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, reference, type, currency, destinationCurrency, amount, status, message, createdAt]
    AdminAccess:
      type: object
      properties:
        allowed: { type: boolean }
        roles:
          type: array
          items: { type: string }
      required: [allowed, roles]
    AdminSummary:
      type: object
      properties:
        registeredUsers: { type: integer }
        activeWallets: { type: integer }
        pendingProviderRequests: { type: integer }
        ledgerTransactions: { type: integer }
        simulationMode: { type: boolean, const: true }
        providerStatus: { type: string, enum: [not_configured] }
      required: [registeredUsers, activeWallets, pendingProviderRequests, ledgerTransactions, simulationMode, providerStatus]
    AdminUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        verificationStatus: { type: string, enum: [not_started, pending, approved, rejected, additional_information_required] }
        verificationNote: { type: ["string", "null"] }
        accountStatus: { type: string, enum: [active, suspended] }
        walletCount: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, email, firstName, lastName, country, verificationStatus, verificationNote, accountStatus, walletCount, createdAt]
    AdminUserDetail:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        phone: { type: ["string", "null"] }
        wallets:
          type: array
          items: { $ref: "#/components/schemas/Wallet" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/BankTransaction" }
      required: [user, phone, wallets, transactions]
    AdminUserStatusInput:
      type: object
      properties:
        accountStatus: { type: string, enum: [active, suspended] }
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [accountStatus, reason]
    AdminIdentityVerificationInput:
      type: object
      properties:
        verificationStatus: { type: string, enum: [approved, rejected, additional_information_required] }
        reason: { type: string, minLength: 5, maxLength: 500 }
        userMessage: { type: string, maxLength: 500 }
      required: [verificationStatus, reason]
    AdminFundingInput:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        senderName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 240 }
        reason: { type: string, minLength: 5, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
      required: [currency, amount, senderName, description, reason, idempotencyKey]
    AdminTransactionDeleteInput:
      type: object
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [reason]
    AdminTransactionDeleteResult:
      type: object
      properties:
        transactionId: { type: string }
        reference: { type: string }
        deleted: { type: boolean, const: true }
      required: [transactionId, reference, deleted]

