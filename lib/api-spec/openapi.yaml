      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFundingInput"
      responses:
        "201":
          description: Simulated funding transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/admin/ledger:
    get:
      operationId: listAdminLedger
      tags: [admin]
      summary: Review posted ledger transactions
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CurrencyCode"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent ledger transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/admin/transactions/{transactionId}/status-history:
    get:
      operationId: listAdminTransactionStatusHistory
      tags: [admin]
      summary: View a transaction's status override history
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Read-only status override history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTransactionStatusChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: Search, filter, and page through transactions
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: customer, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: currency, in: query, required: false, schema: { $ref: "#/components/schemas/CurrencyCode" } }
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/TransactionType" } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/TransactionStatus" } }
        - { name: fromDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: minimumAmount, in: query, required: false, schema: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" } }
        - { name: maximumAmount, in: query, required: false, schema: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Filtered transaction records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTransactionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bank/admin/transactions/{transactionId}:
    get:
      operationId: getAdminTransactionDetail
      tags: [admin]
      summary: Read transaction details and associated ledger entries
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Transaction and ledger detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTransactionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAdminTransactionCorrection
      tags: [admin]
      summary: Reverse a posted transaction or record a compensating adjustment
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTransactionCorrectionInput" }
      responses:
        "201":
          description: Compensating ledger transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      operationId: updateAdminTransactionStatus
      tags: [admin]
      summary: Override a transaction status without changing ledger balances
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTransactionStatusUpdateInput" }
      responses:
        "200":
          description: Updated transaction status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bank/admin/transactions/{transactionId}/process:
    post:
      operationId: processAdminInternalTransfer
      tags: [admin]
      summary: Approve and post an eligible internal-routed transfer to the ledger
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTransactionProcessInput" }
      responses:
        "200":
          description: Transaction posted to the internal ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bank/admin/transactions/{transactionId}/funding-review:
    post:
      operationId: reviewAdminFunding
      tags: [admin]
      summary: Approve or reject funding requiring a second administrator
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFundingReviewInput" }
      responses:
        "200":
          description: Funding decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sign in is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The current user is not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested record was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The operation conflicts with current account or balance state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CurrencyCode:
      type: string
      enum: [USD, EUR, GBP, NGN, CAD, AUD]
    ActiveCurrencyCode:
      type: string
      enum: [USD, EUR, GBP, CAD, AUD]
    DestinationCurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO 4217 destination currency, independent of supported source wallets.
    BankExchangeRate:
      type: object
      properties:
        sourceCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        rate: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,10})?$" }
        updatedAt: { type: string, format: date-time }
      required: [sourceCurrency, destinationCurrency, rate, updatedAt]
    BankExchangeRateInput:
      type: object
      properties:
        sourceCurrency: { $ref: "#/components/schemas/ActiveCurrencyCode" }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        rate: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,10})?$" }
        reason: { type: string, minLength: 5, maxLength: 500 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [sourceCurrency, destinationCurrency, rate, reason, transactionPin]
    InternationalTransferRequestInput:
      type: object
      properties:
        transferType: { type: string, enum: [local_routing, international_wire] }
        destinationCountry: { type: string, minLength: 2, maxLength: 80 }
        recipientBank: { type: string, minLength: 1, maxLength: 120 }
        routingCode: { type: string, maxLength: 24, pattern: "^[A-Za-z0-9 -]*$" }
        swiftBic: { type: string, maxLength: 11, pattern: "^[A-Za-z0-9]*$" }
        recipientAccountName: { type: string, minLength: 1, maxLength: 120 }
        recipientAccountNumber: { type: string, minLength: 4, maxLength: 34, pattern: "^[A-Za-z0-9 ]+$" }
        sourceCurrency: { $ref: "#/components/schemas/ActiveCurrencyCode" }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        expectedExchangeRate: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,10})?$", description: Rate reviewed by the customer; reject if it no longer matches the authoritative rate. }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        remark: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [transferType, destinationCountry, recipientBank, recipientAccountName, recipientAccountNumber, sourceCurrency, destinationCurrency, amount, idempotencyKey, transactionPin]
    InternationalTransferRequest:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { $ref: "#/components/schemas/TransactionStatus" }
        destinationCountry: { type: string }
        recipientBank: { type: string }
        transferType: { type: string, enum: [local_routing, international_wire] }
        routingCode: { type: ["string", "null"] }
        swiftBic: { type: ["string", "null"] }
        recipientAccountName: { type: string }
        recipientAccountLast4: { type: string, pattern: "^[A-Z0-9]{4}$" }
        sourceCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        sourceAmount: { type: string }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        destinationAmount: { type: string }
        exchangeRate: { type: string }
        rateUpdatedAt: { type: string, format: date-time }
        remark: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, reference, status, transferType, destinationCountry, recipientBank, routingCode, swiftBic, recipientAccountName, recipientAccountLast4, sourceCurrency, sourceAmount, destinationCurrency, destinationAmount, exchangeRate, rateUpdatedAt, remark, createdAt]
    TransactionStatus:
      type: string
      enum: [completed, pending, failed, rejected, reversed]
    BankRestrictionType:
      type: string
      enum: [suspend_user, restrict_outgoing_transfers, restrict_withdrawals, restrict_deposits, freeze_wallet, under_review, read_only]
    TransactionType:
      type: string
      enum: [simulation_credit, admin_funding, admin_debit, admin_adjustment, reversal, transfer_in, transfer_out, external_transfer, external_transfer_in, deposit_request, withdrawal_request, exchange_request]
    Wallet:
      type: object
      properties:
        id: { type: string }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        available: { type: string }
        pending: { type: string }
        reserved: { type: string }
        status: { type: string, enum: [active, restricted] }
      required: [id, currency, available, pending, reserved, status]
    BankProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        customerId: { type: string, pattern: "^[A-Z0-9]{7}$" }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        transactionPinConfigured: { type: boolean }
        verificationStatus: { type: string, enum: [not_started, pending, approved, rejected, additional_information_required] }
        verificationNote: { type: ["string", "null"] }
        accountStatus: { type: string, enum: [active, restricted, suspended] }
        createdAt: { type: string, format: date-time }
      required: [id, email, customerId, firstName, lastName, phone, country, dateOfBirth, transactionPinConfigured, verificationStatus, verificationNote, accountStatus, createdAt]
    CustomerIdLookupInput:
      type: object
      properties:
        customerId: { type: string, pattern: "^[A-Za-z0-9]{7}$" }
      required: [customerId]
    CustomerIdLookupResult:
      type: object
      properties:
        email: { type: string, format: email }
      required: [email]
    TransactionPinInput:
      type: object
      properties:
        pin: { type: string, pattern: "^[0-9]{6}$" }
        currentPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [pin]
    TransactionPinUpdateResult:
      type: object
      properties:
        configured: { type: boolean, const: true }
      required: [configured]
    AdminTransactionPinResetInput:
      type: object
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [reason]
    AdminTransactionPinResetResult:
      type: object
      properties:
        configured: { type: boolean, const: false }
      required: [configured]
    BankProfileInput:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 0, maxLength: 80 }
        phone: { type: string, minLength: 3, maxLength: 32 }
        country: { type: string, minLength: 2, maxLength: 80 }
        dateOfBirth: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        acceptedTerms: { type: boolean, const: true }
      required: [firstName, lastName, phone, country, acceptedTerms]
    IdentityDocumentContentType:
      type: string
      enum: [application/pdf, image/jpeg, image/png]
    IdentityDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        contentType: { $ref: "#/components/schemas/IdentityDocumentContentType" }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        status: { type: string, enum: [uploading, uploaded] }
        createdAt: { type: string, format: date-time }
        uploadedAt: { type: ["string", "null"], format: date-time }
      required: [id, contentType, sizeBytes, status, createdAt, uploadedAt]
    IdentityDocumentUploadInput:
      type: object
      properties:
        contentType: { $ref: "#/components/schemas/IdentityDocumentContentType" }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
      required: [contentType, sizeBytes]
    IdentityDocumentUploadUrl:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
      required: [documentId, uploadUrl]
    IdentityVerificationSubmissionInput:
      type: object
      properties:
        confirmed: { type: boolean, const: true }
      required: [confirmed]
    BankTransaction:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        type: { $ref: "#/components/schemas/TransactionType" }
        status: { $ref: "#/components/schemas/TransactionStatus" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string }
        fee: { type: string }
        counterparty: { type: ["string", "null"] }
        description: { type: string }
        mode: { type: string, enum: [internal_ledger] }
        createdAt: { type: string, format: date-time }
      required: [id, reference, type, status, currency, amount, fee, counterparty, description, mode, createdAt]
    BankDashboard:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/BankProfile" }
        wallets:
          type: array
          items: { $ref: "#/components/schemas/Wallet" }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/BankTransaction" }
        referenceCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        internalLedger: { type: boolean, const: true }
      required: [profile, wallets, recentTransactions, referenceCurrency, internalLedger]
    TransferInput:
      type: object
      properties:
        recipientEmail: { type: string, format: email }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        description: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [recipientEmail, currency, amount, idempotencyKey, transactionPin]
    ExternalTransferInput:
      type: object
      properties:
        recipientName: { type: string, minLength: 1, maxLength: 120 }
        destinationCountry: { type: string, minLength: 2, maxLength: 80 }
        bankName: { type: string, minLength: 1, maxLength: 120 }
        accountNumberLast4: { type: string, pattern: "^[A-Z0-9]{4}$" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        description: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [recipientName, destinationCountry, bankName, accountNumberLast4, currency, amount, idempotencyKey, transactionPin]
    IncomingExternalTransferInput:
      type: object
      properties:
        sourceName: { type: string, minLength: 1, maxLength: 120 }
        sourceCountry: { type: string, minLength: 2, maxLength: 80 }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        description: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [sourceName, sourceCountry, currency, amount, idempotencyKey, transactionPin]
    LedgerRequestInput:
      type: object
      properties:
        type: { type: string, enum: [deposit, withdrawal] }
        currency: { $ref: "#/components/schemas/ActiveCurrencyCode" }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        description: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [type, currency, amount, idempotencyKey, transactionPin]
    LedgerRequest:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        type: { type: string, enum: [deposit, withdrawal] }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string }
        status: { type: string, enum: [pending_review, approved, rejected] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, reference, type, currency, amount, status, message, createdAt]
    AdminLedgerRequest:
      type: object
      properties:
        id: { type: string }
        transactionId: { type: string }
        reference: { type: string }
        userId: { type: string }
        memberName: { type: string }
        email: { type: string, format: email }
        type: { type: string, enum: [deposit, withdrawal] }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { type: string }
        description: { type: string }
        status: { type: string, enum: [pending_review, pending_provider_setup, approved, rejected] }
        createdAt: { type: string, format: date-time }
      required: [id, transactionId, reference, userId, memberName, email, type, currency, amount, description, status, createdAt]
    AdminLedgerRequestReviewInput:
      type: object
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 5, maxLength: 500 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [decision, reason, transactionPin]
    AdminAccess:
      type: object
      properties:
        allowed: { type: boolean }
        roles:
          type: array
          items: { type: string }
      required: [allowed, roles]
    AdminSummary:
