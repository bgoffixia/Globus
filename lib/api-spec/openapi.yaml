          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/admin/identity-documents/{documentId}/content:
    get:
      operationId: getAdminIdentityDocumentContent
      tags: [admin]
      summary: Stream an identity document to an authorized admin
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private identity document content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/users/{userId}/verification:
    patch:
      operationId: updateAdminUserVerification
      tags: [admin]
      summary: Record an identity review decision
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIdentityVerificationInput"
      responses:
        "200":
          description: Updated identity review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/admin/users/{userId}/funding:
    post:
      operationId: createAdminFunding
      tags: [admin]
      summary: Add a simulated balance credit to a user wallet
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFundingInput"
      responses:
        "201":
          description: Simulated funding transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/admin/ledger:
    get:
      operationId: listAdminLedger
      tags: [admin]
      summary: Review posted ledger transactions
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CurrencyCode"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent ledger transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/admin/transactions/{transactionId}/status-history:
    get:
      operationId: listAdminTransactionStatusHistory
      tags: [admin]
      summary: View a transaction's status override history
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Read-only status override history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTransactionStatusChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: Search, filter, and page through transactions
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: customer, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: currency, in: query, required: false, schema: { $ref: "#/components/schemas/CurrencyCode" } }
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/TransactionType" } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/TransactionStatus" } }
        - { name: fromDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: minimumAmount, in: query, required: false, schema: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" } }
        - { name: maximumAmount, in: query, required: false, schema: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Filtered transaction records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTransactionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bank/admin/transactions/{transactionId}:
    get:
      operationId: getAdminTransactionDetail
      tags: [admin]
      summary: Read transaction details and associated ledger entries
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Transaction and ledger detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTransactionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAdminTransactionCorrection
      tags: [admin]
      summary: Reverse a posted transaction or record a compensating adjustment
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTransactionCorrectionInput" }
      responses:
        "201":
          description: Compensating ledger transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      operationId: updateAdminTransactionStatus
      tags: [admin]
      summary: Override a transaction status without changing ledger balances
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTransactionStatusUpdateInput" }
      responses:
        "200":
          description: Updated transaction status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bank/admin/transactions/{transactionId}/process:
    post:
      operationId: processAdminInternalTransfer
      tags: [admin]
      summary: Approve and post an eligible internal-routed transfer to the ledger
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTransactionProcessInput" }
      responses:
        "200":
          description: Transaction posted to the internal ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bank/admin/transactions/{transactionId}/funding-review:
    post:
      operationId: reviewAdminFunding
      tags: [admin]
      summary: Approve or reject funding requiring a second administrator
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFundingReviewInput" }
      responses:
        "200":
          description: Funding decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sign in is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The current user is not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested record was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The operation conflicts with current account or balance state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required external service is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CurrencyCode:
      type: string
      enum: [USD, EUR, GBP, NGN, CAD, AUD]
    ActiveCurrencyCode:
      type: string
      enum: [USD, EUR, GBP, CAD]
    DestinationCurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO 4217 currency code for a rate quote, independent of supported source wallets.
    BankExchangeRate:
      type: object
      properties:
        sourceCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        rate: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,10})?$" }
        updatedAt: { type: string, format: date-time }
      required: [sourceCurrency, destinationCurrency, rate, updatedAt]
    BankExchangeRateQuote:
      type: object
      properties:
        sourceCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        rate: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,10})?$" }
        provider: { type: string, enum: [Frankfurter, Grey, Globus] }
        checkedAt: { type: string, format: date-time }
      required: [sourceCurrency, destinationCurrency, rate, provider, checkedAt]
    BankExchangeRateInput:
      type: object
      properties:
        sourceCurrency: { $ref: "#/components/schemas/ActiveCurrencyCode" }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        rate: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,10})?$" }
        reason: { type: string, minLength: 5, maxLength: 500 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [sourceCurrency, destinationCurrency, rate, reason, transactionPin]
    InternationalTransferRequestInput:
      type: object
      properties:
        transferType: { type: string, enum: [local_routing, international_wire] }
        destinationCountry: { type: string, minLength: 2, maxLength: 80 }
        recipientBank: { type: string, minLength: 1, maxLength: 120 }
        routingCode: { type: string, maxLength: 24, pattern: "^[A-Za-z0-9 -]*$" }
        swiftBic: { type: string, maxLength: 11, pattern: "^[A-Za-z0-9]*$" }
        recipientAccountName: { type: string, minLength: 1, maxLength: 120 }
        recipientEmail: { type: string, format: email, maxLength: 254 }
        recipientAccountNumber: { type: string, minLength: 4, maxLength: 34, pattern: "^[A-Za-z0-9 ]+$" }
        sourceCurrency: { $ref: "#/components/schemas/ActiveCurrencyCode" }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        expectedExchangeRate: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,10})?$", description: Rate reviewed by the customer; reject if it no longer matches the authoritative rate. }
        amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
        remark: { type: string, maxLength: 140 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
        transactionPin: { type: string, pattern: "^[0-9]{6}$" }
      required: [transferType, destinationCountry, recipientBank, recipientAccountName, recipientAccountNumber, sourceCurrency, destinationCurrency, amount, idempotencyKey, transactionPin]
    InternationalTransferRequest:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { $ref: "#/components/schemas/TransactionStatus" }
        destinationCountry: { type: string }
        recipientBank: { type: string }
        transferType: { type: string, enum: [local_routing, international_wire] }
        routingCode: { type: ["string", "null"] }
        swiftBic: { type: ["string", "null"] }
        senderName: { type: ["string", "null"] }
        sourceWalletLast4: { type: string, pattern: "^[A-F0-9]{4}$" }
        recipientAccountName: { type: string }
        recipientEmail: { type: ["string", "null"], format: email }
        recipientEmailNotificationSkipped: { type: boolean }
        recipientAccountLast4: { type: string, pattern: "^[A-Z0-9]{4}$" }
        sourceCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        sourceAmount: { type: string }
        destinationCurrency: { $ref: "#/components/schemas/DestinationCurrencyCode" }
        destinationAmount: { type: string }
        exchangeRate: { type: string }
        rateUpdatedAt: { type: string, format: date-time }
        remark: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, reference, status, transferType, destinationCountry, recipientBank, routingCode, swiftBic, senderName, sourceWalletLast4, recipientAccountName, recipientEmail, recipientEmailNotificationSkipped, recipientAccountLast4, sourceCurrency, sourceAmount, destinationCurrency, destinationAmount, exchangeRate, rateUpdatedAt, remark, createdAt]
    TransactionStatus:
      type: string
      enum: [completed, pending, failed, rejected, reversed]
    BankRestrictionType:
      type: string
      enum: [suspend_user, restrict_outgoing_transfers, restrict_withdrawals, restrict_deposits, freeze_wallet, under_review, read_only]
    TransactionType:
      type: string
      enum: [simulation_credit, admin_funding, admin_debit, admin_adjustment, reversal, transfer_in, transfer_out, external_transfer, external_transfer_in, deposit_request, withdrawal_request, exchange_request]
    Wallet:
      type: object
      properties:
        id: { type: string }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        available: { type: string }
        pending: { type: string }
        reserved: { type: string }
        status: { type: string, enum: [active, restricted] }
      required: [id, currency, available, pending, reserved, status]
    BankProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        customerId: { type: string, pattern: "^[A-Z0-9]{7}$" }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        transactionPinConfigured: { type: boolean }
        verificationStatus: { type: string, enum: [not_started, pending, approved, rejected, additional_information_required] }
        verificationNote: { type: ["string", "null"] }
        accountStatus: { type: string, enum: [active, restricted, suspended] }
        depositAllowed: { type: boolean }
        withdrawalAllowed: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, email, customerId, firstName, lastName, phone, country, dateOfBirth, transactionPinConfigured, verificationStatus, verificationNote, accountStatus, depositAllowed, withdrawalAllowed, createdAt]
    BankVaultStatus:
      type: object
      properties:
        configured: { type: boolean }
        subscriptionStatus: { type: string, enum: [inactive, pending, active, rejected, expired] }
        subscriptionActive: { type: boolean }
        requestedAt: { type: ["string", "null"], format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        planCode: { type: ["string", "null"], enum: [1m, 3m, 1y, null] }
        amountMinor: { type: ["string", "null"], pattern: "^[0-9]+$" }
        proofUploadedAt: { type: ["string", "null"], format: date-time }
        paymentStatus: { type: string, enum: [none, pending, failed, success] }
        paymentReference: { type: ["string", "null"] }
      required: [configured, subscriptionStatus, subscriptionActive, requestedAt, expiresAt, planCode, amountMinor, proofUploadedAt, paymentStatus, paymentReference]
    BankVaultSubscriptionRequestResult:
      $ref: "#/components/schemas/BankVaultStatus"
    BankVaultBilling:
      type: object
      properties:
        configured: { type: boolean }
        provider: { type: string, enum: [paystack, manual] }
        paymentMethod: { type: string }
        bankName: { type: string }
        accountName: { type: string }
        accountNumber: { type: string }
        instructions: { type: string }
        plans:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [1m, 3m, 1y] }
              label: { type: string }
              durationMonths: { type: integer }
              priceMinor: { type: string, pattern: "^[0-9]+$" }
              currency: { type: string, enum: [NGN] }
            required: [code, label, durationMonths, priceMinor, currency]
      required: [configured, provider, paymentMethod, bankName, accountName, accountNumber, instructions, plans]
    BankVaultPaystackInitializeInput:
      type: object
      properties:
        planCode: { type: string, enum: [1m, 3m, 1y] }
      required: [planCode]
    BankVaultPaystackCheckout:
      type: object
      properties:
        authorizationUrl: { type: string, format: uri }
        reference: { type: string, minLength: 1, maxLength: 100 }
      required: [authorizationUrl, reference]
    BankVaultPaystackVerifyInput:
      type: object
      properties:
        reference: { type: string, minLength: 1, maxLength: 100 }
      required: [reference]
    BankVaultTransferEmailAlert:
      type: object
      properties:
        enabled: { type: boolean }
      required: [enabled]
    BankVaultProofUploadInput:
      type: object
      properties:
        planCode: { type: string, enum: [1m, 3m, 1y] }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        fileName: { type: string, minLength: 1, maxLength: 120 }
      required: [planCode, contentType, sizeBytes, fileName]
    BankVaultProofUploadResult:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
      required: [uploadUrl]
    BankVaultEmailPreferences:
      type: object
      properties:
        transactionEmailAlertsEnabled: { type: boolean }
        bannerTheme: { type: string, enum: [navy, teal, gold] }
        bannerHeadline: { type: string, minLength: 1, maxLength: 60 }
        bannerBackgroundColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        includeSupportLink: { type: boolean }
        supportUrl: { type: ["string", "null"], format: uri, maxLength: 500 }
        supportLabel: { type: string, minLength: 1, maxLength: 40 }
        senderLocalPart: { type: ["string", "null"], minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$" }
        senderDomain: { type: string, enum: [globus.website] }
        senderDisplayName: { type: string, enum: ["GLOBUS BANK"] }
      required: [transactionEmailAlertsEnabled, bannerTheme, bannerHeadline, bannerBackgroundColor, includeSupportLink, supportUrl, supportLabel, senderLocalPart, senderDomain, senderDisplayName]
    BankVaultEmailPreferencesInput:
      type: object
      properties:
        transactionEmailAlertsEnabled: { type: boolean }
        bannerTheme: { type: string, enum: [navy, teal, gold] }
        bannerHeadline: { type: string, minLength: 1, maxLength: 60 }
        bannerBackgroundColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        includeSupportLink: { type: boolean }
        supportUrl: { type: ["string", "null"], format: uri, maxLength: 500 }
        supportLabel: { type: string, minLength: 1, maxLength: 40 }
        senderLocalPart: { type: ["string", "null"], minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$" }
      minProperties: 1
    BankVaultTransactionNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        note: { type: string, minLength: 1, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, transactionId, note, createdAt, updatedAt]
    BankVaultTransactionNoteInput:
      type: object
      properties:
        note: { type: string, minLength: 1, maxLength: 500 }
      required: [note]
    BankVaultTransactionNoteDeleteResult:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        deleted: { type: boolean, const: true }
      required: [transactionId, deleted]
    BankVaultPasscodeInput:
      type: object
      properties:
        passcode: { type: string, pattern: "^[0-9]{4}$" }
      required: [passcode]
    BankVaultPasscodeUpdateInput:
      type: object
      properties:
        newPasscode: { type: string, pattern: "^[0-9]{4}$" }
      required: [newPasscode]
    BankVaultSession:
      type: object
      properties:
        sessionToken: { type: string, minLength: 32, maxLength: 128 }
        expiresAt: { type: string, format: date-time }
      required: [sessionToken, expiresAt]
    BankVaultWalletControl:
      type: object
      properties:
        walletId: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        transfersEnabled: { type: boolean }
        depositsEnabled: { type: boolean }
        withdrawalsEnabled: { type: boolean }
        futureTransferMode: { type: string, enum: [successful, pending, failed] }
      required: [walletId, currency, transfersEnabled, depositsEnabled, withdrawalsEnabled, futureTransferMode]
    BankVaultWalletControlInput:
      type: object
      properties:
        transfersEnabled: { type: boolean }
        depositsEnabled: { type: boolean }
        withdrawalsEnabled: { type: boolean }
        futureTransferMode: { type: string, enum: [successful, pending, failed] }
      minProperties: 1
    BankNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [transfer, wallet, security] }
        title: { type: string }
        body: { type: string }
        reference: { type: ["string", "null"] }
