          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Identity documents available for review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentityDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/identity-documents/{documentId}/content:
    get:
      operationId: getAdminIdentityDocumentContent
      tags: [admin]
