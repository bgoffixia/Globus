openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Globus internal ledger API; no external financial provider is connected
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bank
    description: Authenticated wallet and banking operations
  - name: admin
    description: Privileged administrative operations
paths:
  /bank/customer-id/lookup:
    post:
      operationId: lookupCustomerId
      summary: Resolve a Globus Customer ID to its Clerk login identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerIdLookupInput"
      responses:
        "200":
          description: Customer ID resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIdLookupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many lookup attempts
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bank/me:
    get:
      operationId: getBankProfile
      tags: [bank]
      summary: Get the authenticated user's Globus Bank profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/dashboard:
    get:
      operationId: getBankDashboard
      tags: [bank]
      summary: Get the user's simulated balances and recent activity
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/wallets:
    get:
      operationId: listBankWallets
      tags: [bank]
      summary: List the authenticated user's currency wallets
      responses:
        "200":
          description: Currency wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/transactions:
    get:
      operationId: listBankTransactions
      tags: [bank]
      summary: Search the authenticated user's transaction history
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CurrencyCode"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/profile:
    put:
      operationId: updateBankProfile
      tags: [bank]
      summary: Save user profile and accept the account terms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/transaction-pin:
    put:
      operationId: updateTransactionPin
      tags: [bank]
      summary: Set or change the authenticated user's transaction PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPinInput"
      responses:
        "200":
          description: Transaction PIN saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPinUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/verification/documents:
    get:
      operationId: listMyIdentityDocuments
      tags: [bank]
      summary: List identity documents belonging to the authenticated user
      responses:
        "200":
          description: The user's identity documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentityDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/verification/documents/upload-url:
    post:
      operationId: createIdentityDocumentUploadUrl
      tags: [bank]
      summary: Request a private upload URL for an identity document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityDocumentUploadInput"
      responses:
        "201":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityDocumentUploadUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/verification/documents/{documentId}/complete:
    post:
      operationId: completeIdentityDocumentUpload
      tags: [bank]
      summary: Validate and complete an identity document upload
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Uploaded identity document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/verification/documents/{documentId}:
    delete:
      operationId: deleteMyIdentityDocument
      tags: [bank]
      summary: Remove an identity document before it enters review
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Document removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/verification/submit:
    post:
      operationId: submitIdentityDocuments
      tags: [bank]
      summary: Submit uploaded identity documents for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityVerificationSubmissionInput"
      responses:
        "200":
          description: Verification request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/transfers:
    post:
      operationId: createBankTransfer
      tags: [bank]
      summary: Retired member-to-member transfer endpoint
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "410":
          description: Member-to-member transfers are no longer available
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/external-transfers:
    post:
      operationId: createExternalTransfer
      tags: [bank]
      summary: Disabled legacy external-transfer route
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalTransferInput"
      responses:
        "410":
          description: External transfers are not supported
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /bank/exchange-rates:
    get:
      operationId: listBankExchangeRates
      tags: [bank]
      summary: List administrator-maintained internal conversion rates
      responses:
        "200":
          description: Current internal rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankExchangeRate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/international-transfer-requests:
    get:
      operationId: listInternationalTransferRequests
      tags: [bank]
      summary: List the authenticated user's internal international transfer requests
      responses:
        "200":
          description: Transfer requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InternationalTransferRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createInternationalTransferRequest
      tags: [bank]
      summary: Record or complete an internal routed transfer
      description: Verified users complete an internal ledger transfer; unverified users create a pending request for administrator review. No outside account is paid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternationalTransferRequestInput"
      responses:
        "201":
          description: Internal transfer completed or request submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternationalTransferRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/admin/exchange-rates:
    put:
      operationId: upsertBankExchangeRate
      tags: [admin]
      summary: Set an administrator-maintained internal conversion rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankExchangeRateInput"
      responses:
        "200":
          description: Saved internal conversion rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankExchangeRate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/incoming-external-transfers:
    post:
      operationId: createIncomingExternalTransfer
      tags: [bank]
      summary: Disabled legacy incoming-transfer route
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingExternalTransferInput"
      responses:
        "410":
          description: External deposits are not supported
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /bank/ledger-requests:
    post:
      operationId: createLedgerRequest
      tags: [bank]
      summary: Request an internal ledger deposit or withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerRequestInput"
      responses:
        "201":
          description: Recorded internal ledger request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check whether the signed-in user has administrator access
      responses:
        "200":
          description: Admin access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get operational totals from stored ledger records
      responses:
        "200":
          description: Admin summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [admin]
      summary: Search and page through customer currency wallets
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: currency, in: query, required: false, schema: { $ref: "#/components/schemas/CurrencyCode" } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, restricted] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Wallet accounts with ledger-derived balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccountPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bank/admin/wallets/{walletId}:
    patch:
      operationId: updateAdminWalletStatus
      tags: [admin]
      summary: Freeze or unfreeze a wallet with an audited reason
      parameters:
        - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminWalletStatusInput" }
      responses:
        "200":
          description: Updated wallet status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/admin/restrictions:
    get:
      operationId: listAdminRestrictions
      tags: [admin]
      summary: Search and page through account and wallet restrictions
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/BankRestrictionType" } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, scheduled, expired, removed] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Restrictions and their retained decision history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRestrictionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminRestriction
      tags: [admin]
      summary: Create a confirmed and audited account or wallet restriction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRestrictionInput" }
      responses:
        "201":
          description: Created restriction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRestriction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bank/admin/restrictions/{restrictionId}/remove:
    post:
      operationId: removeAdminRestriction
      tags: [admin]
      summary: Remove one restriction while preserving all other active restrictions
      parameters:
        - { name: restrictionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRestrictionRemoveInput" }
      responses:
        "200":
          description: Removed restriction with retained history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRestriction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bank/admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: Search and page through administrative audit events
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLogPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bank/admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Read operational funding and frozen-wallet policies
      responses:
        "200":
          description: Current operational settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update funding limits and approval settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsInput" }
      responses:
        "200":
          description: Saved operational settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bank/admin/ledger-requests:
    get:
      operationId: listAdminLedgerRequests
      tags: [admin]
      summary: List pending internal ledger deposit and withdrawal requests
      responses:
        "200":
          description: Pending requests for administrator review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminLedgerRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/admin/ledger-requests/{requestId}:
    patch:
      operationId: reviewAdminLedgerRequest
      tags: [admin]
      summary: Approve or reject an internal ledger request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLedgerRequestReviewInput"
      responses:
        "200":
          description: Reviewed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLedgerRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bank/admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Search and list user records
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: accountStatus
          in: query
          required: false
          schema: { type: string, enum: [active, restricted, suspended] }
        - name: verificationStatus
          in: query
          required: false
          schema: { type: string, enum: [not_started, pending, approved, rejected, additional_information_required] }
      responses:
        "200":
          description: User records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bank/admin/users/{userId}:
    get:
      operationId: getAdminUserDetail
      tags: [admin]
      summary: Get one user's profile, wallets, and recent activity
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: User management detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/users/{userId}/transaction-pin/reset:
    post:
      operationId: resetAdminUserTransactionPin
      tags: [admin]
      summary: Reset a member's transaction PIN without exposing its value
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTransactionPinResetInput"
      responses:
        "200":
          description: PIN reset; member must set a new PIN before their next transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransactionPinResetResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/users/{userId}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [admin]
      summary: Suspend or reactivate a user with a documented reason
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusInput"
      responses:
        "200":
          description: Updated account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/admin/users/{userId}/profile:
    patch:
      operationId: updateAdminUserProfile
      tags: [admin]
      summary: Edit permitted member profile fields with a documented reason
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserProfileInput" }
      responses:
        "200":
          description: Updated member profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/admin/users/{userId}/verification-documents:
    get:
      operationId: listAdminIdentityDocuments
