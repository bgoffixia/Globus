name: Initialize Neon Database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-schema-initialization
  cancel-in-progress: false

jobs:
  initialize:
    name: Push Globus Drizzle schema to Neon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize database schema
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/db push 2>&1 | tee /tmp/drizzle-push.log
          push_status=${PIPESTATUS[0]}

          # Drizzle Kit 0.31.x may report database errors while exiting with status 0.
          if grep -Eiq "Interactive prompts require a TTY terminal|^error:|severity: 'ERROR'|SQLSTATE" /tmp/drizzle-push.log; then
            echo "::error::Drizzle Kit reported a prompt or database error. Treating this run as failed."
            exit 1
          fi

          exit "$push_status"
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
