name: Better Auth MFA staging CI

on:
  push:
    branches:
      - staging/better-auth-mfa
  pull_request:
    branches:
      - staging/better-auth-mfa

permissions:
  contents: read

concurrency:
  group: better-auth-mfa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check isolated Better Auth MFA configuration
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.better-auth-staging.json
      - name: Build workspace
        run: PORT=24083 BASE_PATH=/ NODE_ENV=production pnpm run build
